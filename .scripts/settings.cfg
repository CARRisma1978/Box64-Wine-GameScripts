# =============================================================================
#  Settings shared by all the Windows game launchers in roms/windows
#  Read by common.inc (same folder) each time a game starts.
#
#  These are about the Pi, the TV and the installed software - never about
#  one game. A game's own .sh can still set any of them itself: its value
#  then wins, for that game only.
#
#  Format: KEY="value", one per line. Lines starting with # are notes.
#  $HOME and settings above a line can be used in it (as in WINE_BIN below).
#  Edit with Notepad++ (or any editor) and save with Unix (LF) line endings.
#  If this file is missing, the launchers use the same values built in.
# =============================================================================

# ----- Wine and Box64 ---------------------------------------------------------
# Wine: the active version the wine module (RetroPie-Setup) points to
WINE_DIR="$HOME/wine-wow64/wine/bin"
WINE_BIN="$WINE_DIR/wine"
WINESERVER_BIN="$WINE_DIR/wineserver"
# Box64: installed by the box64 module
BOX64_BIN="/usr/local/bin/box64"

# ----- The TV -----------------------------------------------------------------
# The TV's mode (the X screen keeps it; the scripts scale each game to it)
NATIVE_RES="1920x1080"
# How the Pi scales a game's picture up: bilinear = smooth, nearest =
# sharp/blocky. (nearest can give a fine vertical grain on plain colour
# areas on this TV)
SCALE_FILTER="bilinear"

# ----- Sound ------------------------------------------------------------------
HDMI_CARD="vc4hdmi0"        # vc4hdmi0 = HDMI port 0, vc4hdmi1 = port 1
PA_LATENCY_MS=60            # PulseAudio mixer (SOUND_MIXER=2): sound buffered
                            #   between the game and PulseAudio, in ms -
                            #   higher = safer from clicks, sound slightly
                            #   later ("" = PulseAudio's default)
# MIDI music (FluidSynth): the General MIDI soundfont
# (sudo apt install fluidsynth fluid-soundfont-gm)
SOUNDFONT="/usr/share/sounds/sf2/FluidR3_GM.sf2"

# ----- Start-up messages ------------------------------------------------------
BOOT_LOG_SCALE=2.25         # text size: times the built-in font's
                            #   size, on the TV
BOOT_LOG_FULL=1             # 1 = shown over the whole TV at 1:1 (sharp), the
                            #   game's zoom after them; 0 = over the game's
                            #   zoomed area
BOOT_LOG_MIN_WINDOW="100x40"    # the game's windows smaller than this are
                                #   ignored (e.g. a small splash picture)
